<div class="login-wrapper">
  <div class="glow-bg red-glow"></div>
  <div class="glow-bg violet-glow"></div>

  <div class="login-box">
    <!-- Painel com Foto Lateral da Tatuagem -->
    <div class="login-image-side">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS195jaHon_R374EgkuS8sLXd3Qs8NFup9znplWJwkIEA&s=10" alt="Tatuagem">
      <div class="image-overlay"></div>
    </div>

    <!-- Painel do Formulário -->
    <div class="login-card">
      <div class="brand-header">
        <h1>ESTÚDIO DE TATUAGEM</h1>
        <p>Tenha beleza e qualidade em um só lugar!</p>
      </div>

      <form (ngSubmit)="fazerLogin()" class="login-form">
        <div class="input-group">
          <label for="email">E-mail do Operador</label>
          <div class="input-field">
            <input 
              id="email" 
              type="email" 
              [(ngModel)]="usuario.email" 
              name="email" 
              placeholder="artista@estudio.com" 
              autocomplete="off"
              required>
          </div>
        </div>

        <div class="input-group">
          <label for="senha">Chave de Acesso</label>
          <div class="input-field">
            <input 
              id="senha" 
              type="password" 
              [(ngModel)]="usuario.senha" 
              name="senha" 
              placeholder="••••••••••••" 
              required>
          </div>
        </div>

        <div *ngIf="mensagemErro" class="error-banner">
          <span>⚠️</span> {{ mensagemErro }}
        </div>

        <button type="submit" class="btn-primary">
          <span>ENTRAR NO PAINEL</span>
        </button>
      </form>

      <div class="card-footer">
        <span>Acesso restrito a profissionais autorizados</span>
      </div>
    </div>
  </div>
</div>
